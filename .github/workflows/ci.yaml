name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - tree-sitter-0.23

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
